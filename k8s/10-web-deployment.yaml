# Remember to replace YOUR_DOCKERHUB_USERNAME below with your real Docker
# Hub username before applying this file.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: web
  namespace: skinscan
  labels:
    app: web
spec:
  replicas: 1
  selector:
    matchLabels:
      app: web
  template:
    metadata:
      labels:
        app: web
    spec:
      containers:
        - name: web
          image: majahristoska/skinscan-web:latest
          ports:
            - containerPort: 80
          readinessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 5
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 10
            periodSeconds: 15
