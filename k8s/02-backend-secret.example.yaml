# TEMPLATE - copy this file to "02-backend-secret.yaml" (that exact name
# is gitignored, see .gitignore's "k8s/*-secret.yaml" - this .example.yaml
# is the only one meant to actually be committed) and fill in real values
# before applying. Never commit the real secret.yaml.
apiVersion: v1
kind: Secret
metadata:
  name: backend-secrets
  namespace: skinscan
type: Opaque
stringData:
  SECRET_KEY: "change-me-to-a-random-secret-string"
  # Must be the exact same value as POSTGRES_PASSWORD in
  # 06-postgres-secret.yaml - this is what the backend uses to connect,
  # that's what Postgres was actually started with.
  DB_PASSWORD: "change-me-too"
  # Optional - leave blank to skip Gemini calls (recommendations/chat
  # fall back to built-in fallback text instead). Get one at
  # https://aistudio.google.com/
  GEMINI_API_KEY: ""
