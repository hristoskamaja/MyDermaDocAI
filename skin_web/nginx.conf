# Single entry point for the whole web app: serves the built React files
# AND reverse-proxies API/admin/media calls to the Django backend, so the
# browser only ever talks to one origin (no CORS to configure at all).
#
# "backend" is a plain hostname, resolved via whatever container platform
# is running this - Docker Compose's built-in DNS (service named
# "backend" in docker-compose.yml) or Kubernetes' in-cluster DNS (Service
# named "backend" in k8s/backend-service.yaml). Same file, no edits,
# works in both.
server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # nginx's default is 1MB - too small for a real scan photo upload
    # (413 Request Entity Too Large otherwise). Matches the K8s Ingress's
    # proxy-body-size annotation (see k8s/12-ingress.yaml) so both
    # environments behave the same.
    client_max_body_size 20m;

    location /api/ {
        proxy_pass http://backend:8000/api/;
        # $http_host, not $host - $host silently strips the port (nginx
        # normalizes it), so Django was building absolute image URLs like
        # http://localhost/media/... instead of http://localhost:3000/media/...
        # (defaulting to port 80, which nothing listens on) - that's why
        # scan photos failed to load with ERR_CONNECTION_REFUSED.
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Django's own built-in admin site (separate from the React admin
    # panel, which just calls /api/ like any other client) - handy for
    # quick superuser/db checks during the demo.
    location /admin/ {
        proxy_pass http://backend:8000/admin/;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Django admin's CSS/JS (collected by whitenoise at image build time -
    # see skin_backend/entrypoint.sh). Deliberately NOT "/static/" - React's
    # own build also serves its JS/CSS bundle under /static/js/, /static/css/
    # from this same nginx container, and a generic /static/ proxy rule here
    # would swallow those requests too (Django doesn't have those files,
    # returns a 404 HTML page, and the browser rejects it for MIME-type
    # mismatch - that's the "Refused to execute script" error you saw).
    # See skin_backend/skin_scan/settings.py's matching STATIC_URL.
    location /django-static/ {
        proxy_pass http://backend:8000/django-static/;
        proxy_set_header Host $http_host;
    }

    location /media/ {
        proxy_pass http://backend:8000/media/;
        proxy_set_header Host $http_host;
    }

    # React Router does client-side routing - a hard refresh on a deep
    # link like /scan/42 is still an HTTP request for that exact path,
    # which nginx has no file for, so it must fall back to index.html
    # and let React Router take over instead of returning a 404.
    location / {
        try_files $uri /index.html;
    }
}
